name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - name: Headless build (no GPUI)
        run: cargo build -p fluxwire --no-default-features

  # Headless MCP server: an rmcp client over stdio and the unix socket, plus the scenario and
  # event-feed tools against a fake bridge. No display needed.
  smoke-headless:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fluxwire --no-default-features
      - run: cargo test -p fluxwire-agent --test transports --test scenarios --test ui_tools

  # The dev-mcp app under xvfb, driven by short scenarios; fails on a failed assertion or an
  # audit error. Screenshots are kept as an artifact.
  smoke-ui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for GPUI, xvfb and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig-dev libssl-dev \
            xvfb mesa-vulkan-drivers imagemagick
      - name: Run scenarios under xvfb
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" scripts/smoke-ui.sh \
            fixtures/scenarios/m02-collections.yaml fixtures/scenarios/m04-environments.yaml \
            fixtures/scenarios/m07-scripts-trust.yaml fixtures/scenarios/m08-websocket.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ui-linux
          path: target/smoke

  # macOS has a window server on hosted runners but no Screen Recording grant, so screenshot
  # checkpoints are skipped there (`--no-capture`); assertions and the audit still run.
  smoke-ui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run scenarios
        env:
          SMOKE_FEATURES: dev-mcp,runtime-shaders
        run: |
          scripts/smoke-ui.sh --no-capture \
            fixtures/scenarios/m02-collections.yaml fixtures/scenarios/m04-environments.yaml \
            fixtures/scenarios/m07-scripts-trust.yaml fixtures/scenarios/m08-websocket.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ui-macos
          path: target/smoke

  # The static CLI alone, inside an alpine container with only that binary.
  cli-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make cli-static
      - name: Serve a health endpoint
        run: |
          mkdir -p /tmp/www && echo ok > /tmp/www/health
          (cd /tmp/www && python3 -m http.server 8099 --bind 127.0.0.1 &) ; sleep 1
      - name: Run the sample collection in alpine
        run: |
          docker run --rm --network host \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/fluxwire-cli:/usr/local/bin/fluxwire-cli:ro" \
            -v "$PWD/fixtures:/fixtures" -w /fixtures alpine:3 \
            fluxwire-cli run cli-smoke --env ci --reporter junit -o /fixtures/out.xml
          grep -q "<testsuites" fixtures/out.xml

  # Shell scripts: lint, then run their self-tests (install.sh against a fake release, release
  # notes grouping, Homebrew rendering). macOS covers the BSD userland, Ubuntu the GNU one.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - run: sh scripts/test-install.sh
      - run: sh scripts/test-release-notes.sh
      - run: sh scripts/test-render-tap.sh

  # install.sh on a fresh Ubuntu container, CLI only (no GPUI libraries in the image). The
  # release directory is local (file://), laid out like a GitHub release.
  install-fresh-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make cli-archive TARGET=x86_64-unknown-linux-musl
      - name: Install in a bare Ubuntu container
        run: |
          v=$(make version | tail -n 1)
          mkdir -p "rel/v$v" && cp dist/fluxwire-cli-"$v"-x86_64-unknown-linux-musl.tar.gz "rel/v$v/"
          (cd "rel/v$v" && sha256sum ./* | sed 's#\./##' > SHA256SUMS)
          docker run --rm -v "$PWD/rel:/rel:ro" -v "$PWD/scripts:/scripts:ro" ubuntu:24.04 sh -c "
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null &&
            FLUXWIRE_BASE_URL=file:///rel sh /scripts/install.sh --cli-only --version $v &&
            /root/.local/bin/fluxwire-cli --version"

  # Startup budget (SPEC §20: < 300 ms). Hosted runners are slower than the reference laptops,
  # so the median of five runs is allowed TOLERANCE times the budget (ADR-023).
  startup-timing:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libasound2-dev libfontconfig-dev libssl-dev \
            xvfb mesa-vulkan-drivers
      - run: make build-release
      - name: Measure startup (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x900x24" env TOLERANCE=3 scripts/startup-timing.sh target/release/fluxwire
      - name: Measure startup (macOS)
        if: runner.os == 'macOS'
        run: TOLERANCE=3 scripts/startup-timing.sh target/release/fluxwire

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: make install-script
      - run: cd site && npm ci
      - name: Regenerate reference pages and fail if they are stale
        run: |
          cd site && npm run gen
          git diff --exit-code -- . ':!public/install.sh'
      - run: cd site && npx astro build
      - run: cd site && npm run contrast && node scripts/check-links.mjs
      - name: Lighthouse (accessibility >= 0.95)
        run: cd site && npx lhci autorun --config=lighthouserc.json
