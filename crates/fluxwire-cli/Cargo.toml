[package]
name = "fluxwire-cli"
description = "clap command tree and reporters (no GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fluxwire-model.workspace = true
fluxwire-format.workspace = true
fluxwire-runner.workspace = true
fluxwire-agent.workspace = true
clap = { version = "4", features = ["derive"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread"] }
fluxwire-protocol.workspace = true
serde_json.workspace = true
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2"

[[bin]]
name = "fluxwire-cli"
path = "src/main.rs"
