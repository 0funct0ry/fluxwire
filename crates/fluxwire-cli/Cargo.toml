[package]
name = "fluxwire-cli"
description = "clap command tree and reporters (no GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["graphql"]
# GraphQL support (SPEC §7.9). Without it `requires: [graphql]` files exit 66.
graphql = ["fluxwire-runner/graphql", "fluxwire-agent/graphql"]

[dependencies]
fluxwire-model.workspace = true
fluxwire-format.workspace = true
fluxwire-runner = { workspace = true, features = ["http", "ws"] }
fluxwire-agent.workspace = true
fluxwire-import.workspace = true
fluxwire-openapi.workspace = true
fluxwire-docs.workspace = true
clap = { version = "4", features = ["derive"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread"] }
fluxwire-protocol.workspace = true
serde_json.workspace = true
clap_complete = "4"

[dev-dependencies]
fluxwire-openapi.workspace = true
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "fluxwire-cli"
path = "src/main.rs"
