[package]
name = "fluxwire-format"
description = ".flux.md parser, span editor, formatter, diagnostics, collections on disk."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fluxwire-model.workspace = true
fluxwire-protocol.workspace = true
fluxwire-vars.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true
serde_json.workspace = true
schemars = "1"
toml = "0.8"
toml_edit = "0.22"
trash = "5"
notify = "8"

[dev-dependencies]
fluxwire-protocol = { workspace = true, features = ["graphql"] }
insta = "1"
proptest = "1"
tempfile = "3"
