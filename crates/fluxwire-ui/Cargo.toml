[package]
name = "fluxwire-ui"
description = "GPUI application: windows, panels, tabs, editors, palette."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Compile Metal shaders at runtime so macOS builds work without the Xcode Metal toolchain.
runtime-shaders = ["gpui/runtime_shaders"]
# Hosts the MCP server in-process for agent testing (ADR-009). Off by default and in release.
dev-mcp = ["dep:fluxwire-agent", "dep:tokio"]

[dependencies]
fluxwire-model.workspace = true
fluxwire-format.workspace = true
fluxwire-import.workspace = true
fluxwire-openapi.workspace = true
gpui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
fluxwire-runner.workspace = true
fluxwire-agent = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"], optional = true }
tree-sitter = "0.26.13"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
directories = "6"
unicode-segmentation = "1"
smol = "2"
fluxwire-protocol.workspace = true
fluxwire-vars.workspace = true
fluxwire-store.workspace = true
fluxwire-search.workspace = true
fluxwire-script.workspace = true
nucleo-matcher = "0.3.1"
pulldown-cmark = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
tungstenite = "0.30.0"
gpui = { workspace = true, features = ["test-support"] }
