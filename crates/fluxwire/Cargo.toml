[package]
name = "fluxwire"
description = "The fluxwire binary: CLI dispatch, opens the UI when no subcommand is given."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["gui", "graphql"]
graphql = ["fluxwire-cli/graphql", "fluxwire-ui?/graphql"]
gui = ["dep:fluxwire-ui"]
runtime-shaders = ["fluxwire-ui/runtime-shaders"]
dev-mcp = ["gui", "fluxwire-ui/dev-mcp"]

[dependencies]
fluxwire-cli.workspace = true
fluxwire-ui = { workspace = true, optional = true }

[dev-dependencies]
rmcp = { version = "3.8.0", features = ["client", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "io-util"] }
serde_json = "1"
