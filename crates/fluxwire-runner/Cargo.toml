[package]
name = "fluxwire-runner"
description = "Request lifecycle, folder and collection runs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fluxwire-model.workspace = true
fluxwire-protocol.workspace = true
fluxwire-vars.workspace = true
fluxwire-script.workspace = true
fluxwire-http = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"
toml = "0.8"
serde = { workspace = true }

[features]
default = ["http"]
http = ["dep:fluxwire-http"]

[dev-dependencies]
axum = "0.8"
fluxwire-format.workspace = true
tokio = { version = "1", features = ["full"] }
