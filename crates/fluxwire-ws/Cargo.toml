[package]
name = "fluxwire-ws"
description = "WebSocket protocol engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fluxwire-protocol.workspace = true
fluxwire-model.workspace = true
fluxwire-vars.workspace = true
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures = "0.3.34"
bytes = "1.12.1"
serde_json = { workspace = true }
base64 = "0.23.1"
url = "2.5.8"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
rustls-pemfile = "2.2.0"

[dev-dependencies]
fluxwire-format.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.54.1", features = ["full"] }
