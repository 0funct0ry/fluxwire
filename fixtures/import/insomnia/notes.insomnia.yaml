type: collection.insomnia.rest/5.0
name: Notes
collection:
  - name: Notes
    children:
      - name: Create note
        method: POST
        url: "{{ _.host }}/notes"
        body:
          mimeType: application/x-www-form-urlencoded
          params:
            - name: text
              value: hello
        authentication:
          type: basic
          username: me
          password: "{{ _.password }}"
      - name: Get note
        method: GET
        url: "{{ _.host }}/notes/1"
  - name: Ping
    method: GET
    url: "{{ _.host }}/ping"
environments:
  name: Base Environment
  data:
    host: http://localhost:4000
    password: s3cret
