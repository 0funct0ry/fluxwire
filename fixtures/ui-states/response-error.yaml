# A transport error: the request is sent with no environment, so the URL cannot be reached.
workspace: fixtures/payments-api
size: default
steps:
  - step: command
    command: open_file
    key: payments/get-payment.flux.md
    permanent: true
  - step: command
    command: set_url
    value: http://127.0.0.1:9/unreachable
  - step: invoke
    name: Send
  - step: wait_for
    path: /response/error
  - step: wait_idle
