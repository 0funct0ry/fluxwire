# An open WebSocket session. Needs the sample echo server running.
workspace: fixtures/payments-api
size: default
steps:
  - step: command
    command: open_file
    key: events/order-stream.flux.md
    permanent: true
  - step: command
    command: choose_environment
    name: local
  - step: invoke
    name: Connect
  - step: wait_for
    path: /session_log
  - step: wait_idle
