[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0funct0ry/fluxwire"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# GPUI is pre-1.0; exact pin, see docs/adr/001-gpui-version.md.
gpui = "=0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fluxwire-model = { path = "crates/fluxwire-model" }
fluxwire-format = { path = "crates/fluxwire-format" }
fluxwire-protocol = { path = "crates/fluxwire-protocol", default-features = false }
fluxwire-vars = { path = "crates/fluxwire-vars" }
fluxwire-http = { path = "crates/fluxwire-http" }
fluxwire-httpcore = { path = "crates/fluxwire-httpcore" }
fluxwire-graphql = { path = "crates/fluxwire-graphql" }
fluxwire-ws = { path = "crates/fluxwire-ws" }
fluxwire-script = { path = "crates/fluxwire-script" }
fluxwire-runner = { path = "crates/fluxwire-runner", default-features = false }
fluxwire-store = { path = "crates/fluxwire-store" }
fluxwire-import = { path = "crates/fluxwire-import" }
fluxwire-openapi = { path = "crates/fluxwire-openapi" }
fluxwire-search = { path = "crates/fluxwire-search" }
fluxwire-docs = { path = "crates/fluxwire-docs" }
fluxwire-ui = { path = "crates/fluxwire-ui", default-features = false }
fluxwire-cli = { path = "crates/fluxwire-cli", default-features = false }
fluxwire-agent = { path = "crates/fluxwire-agent", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
